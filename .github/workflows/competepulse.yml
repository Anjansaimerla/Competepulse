name: Competepulse Weekly Run

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target competitor domain to check on-demand (e.g. timekettle.co)'
        required: false
        default: ''
      pages:
        description: 'Comma-separated page types'
        required: false
        default: 'pricing,changelog,terms'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    environment: FIRECRAWL_API_KEY
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Competepulse Agent
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY || vars.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || vars.NVIDIA_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          COMPETEPULSE_MODEL: ${{ secrets.COMPETEPULSE_MODEL || vars.COMPETEPULSE_MODEL || 'deepseek-ai/deepseek-v4-flash-0731' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN || vars.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID || vars.SLACK_CHANNEL_ID }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY || vars.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL || vars.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS || vars.RECIPIENT_EMAILS }}
          COMPETEPULSE_TARGETS: targets.json
        run: |
          if [ -n "${{ github.event.inputs.domain }}" ]; then
            python main.py --domain "${{ github.event.inputs.domain }}" --pages "${{ github.event.inputs.pages || 'pricing,changelog,terms' }}"
          else
            python main.py
          fi
